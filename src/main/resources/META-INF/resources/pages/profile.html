<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninju - Configurações</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">NINJU</a>
        <ul class="navbar-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="daily-log.html">Diário</a></li>
            <li><a href="relatorios.html">Relatórios</a></li>
            <li id="nav-users" style="display:none"><a href="users.html">Usuários</a></li>
        </ul>
        <div class="navbar-user">
            <button class="avatar-btn" id="avatarBtn" onclick="toggleDropdown()">
                <img id="navAvatar" src="../images/avatars/default.svg" alt="avatar">
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <img class="dropdown-avatar" id="dropdownAvatar" src="../images/avatars/default.svg" alt="avatar">
                    <div>
                        <div class="dropdown-username" id="dropdownName"></div>
                        <div class="dropdown-role" id="dropdownRole"></div>
                    </div>
                </div>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Meu Perfil
                    </a>
                    <a href="foods.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                        Alimentos
                    </a>
                    <a href="workouts.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M2 9h4M18 9h4M2 15h4M18 15h4"/></svg>
                        Treinos
                    </a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item dropdown-item-danger" onclick="logout()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-title">Configurações</h2>

        <!-- Tab nav -->
        <div class="settings-tabs">
            <button class="tab-btn active" data-tab="perfil">Perfil</button>
            <button class="tab-btn" data-tab="seguranca">Segurança</button>
            <button class="tab-btn" data-tab="metas">Metas</button>
        </div>

        <!-- ── TAB: PERFIL ── -->
        <div class="tab-content active" id="tab-perfil">
            <div id="alert-perfil" class="alert"></div>

            <div class="settings-section">
                <h3 class="settings-section-title">Revisão de Perfil</h3>
                <div class="profile-review">
                    <div class="profile-avatar-wrap">
                        <img id="profileAvatarPreview" src="../images/avatars/default.svg" class="profile-avatar-big" alt="avatar">
                        <button class="btn btn-secondary btn-sm" onclick="openAvatarModal()">Editar Avatar</button>
                    </div>
                    <div class="profile-review-info">
                        <p class="profile-review-name" id="reviewName"></p>
                        <p class="profile-review-email" id="reviewEmail"></p>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3 class="settings-section-title">Informações Pessoais</h3>
                <form id="profileForm" class="settings-form">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="pName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="pEmail" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar alterações</button>
                </form>
            </div>
        </div>

        <!-- ── TAB: SEGURANÇA ── -->
        <div class="tab-content" id="tab-seguranca">
            <div id="alert-seguranca" class="alert"></div>

            <div class="settings-section">
                <h3 class="settings-section-title">Alterar Senha</h3>
                <form id="passwordForm" class="settings-form">
                    <div class="form-group">
                        <label>Senha atual</label>
                        <input type="password" id="currentPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label>Nova senha</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirmar nova senha</label>
                        <input type="password" id="confirmNewPassword" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary">Alterar senha</button>
                </form>
            </div>
        </div>

        <!-- ── TAB: METAS ── -->
        <div class="tab-content" id="tab-metas">
            <div id="alert-metas" class="alert"></div>

            <div class="settings-section">
                <h3 class="settings-section-title">Dados Físicos</h3>
                <form id="goalsForm" class="settings-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Peso atual (kg)</label>
                            <input type="number" id="gWeight" class="form-control" step="0.1" min="1" placeholder="Ex: 70.5">
                        </div>
                    </div>

                    <h3 class="settings-section-title" style="margin-top:24px">Meta de Calorias</h3>
                    <div class="form-group">
                        <label>Calorias diárias (kcal)</label>
                        <div class="input-suffix-wrap">
                            <input type="number" id="gCalories" class="form-control" min="500" max="10000" placeholder="Ex: 2000">
                            <span class="input-suffix">kcal</span>
                        </div>
                    </div>
                    <div class="idr-link">
                        <button type="button" class="btn-link" onclick="openIdrModal()">Calcular o meu IDR</button>
                    </div>

                    <h3 class="settings-section-title" style="margin-top:24px">Metas de Macronutrientes <span class="macro-sum" id="macroSum"></span></h3>
                    <div class="macro-row">
                        <div class="form-group">
                            <label>Carboidratos</label>
                            <div class="input-suffix-wrap">
                                <input type="number" id="gCarbs" class="form-control" min="0" max="100" placeholder="50" oninput="updateMacroSum()">
                                <span class="input-suffix">%</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Proteínas</label>
                            <div class="input-suffix-wrap">
                                <input type="number" id="gProtein" class="form-control" min="0" max="100" placeholder="20" oninput="updateMacroSum()">
                                <span class="input-suffix">%</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Gorduras</label>
                            <div class="input-suffix-wrap">
                                <input type="number" id="gFat" class="form-control" min="0" max="100" placeholder="30" oninput="updateMacroSum()">
                                <span class="input-suffix">%</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Salvar metas</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ── MODAL: AVATAR ── -->
    <div class="modal-overlay" id="avatarModal">
        <div class="modal avatar-modal">
            <div class="modal-header">
                <span class="modal-title">Alterar avatar</span>
                <button class="modal-close" onclick="closeAvatarModal()">&times;</button>
            </div>

            <div class="avatar-modal-preview">
                <img id="avatarModalPreview" src="../images/avatars/default.svg" alt="preview">
            </div>

            <div class="avatar-presets-label">Escolha um avatar</div>
            <div class="avatar-presets" id="avatarPresets"></div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAvatarModal()">Cancelar</button>
                <button class="btn btn-primary" id="avatarConfirmBtn" onclick="confirmAvatar()">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ── MODAL: IDR ── -->
    <div class="modal-overlay" id="idrModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Calcular IDR</span>
                <button class="modal-close" onclick="closeIdrModal()">&times;</button>
            </div>

            <div class="form-group">
                <label>Idade</label>
                <input type="number" id="idrAge" class="form-control" min="10" max="120" placeholder="Ex: 25">
            </div>
            <div class="form-group">
                <label>Peso (kg)</label>
                <input type="number" id="idrWeight" class="form-control" step="0.1" placeholder="Ex: 70">
            </div>
            <div class="form-group">
                <label>Altura (cm)</label>
                <input type="number" id="idrHeight" class="form-control" placeholder="Ex: 170">
            </div>
            <div class="form-group">
                <label>Sexo</label>
                <div class="radio-group">
                    <label><input type="radio" name="idrSex" value="F" checked> Feminino</label>
                    <label><input type="radio" name="idrSex" value="M"> Masculino</label>
                </div>
            </div>
            <div class="form-group">
                <label>Objetivo da Dieta</label>
                <select id="idrGoal" class="form-control">
                    <option value="500">Ganho de Peso (+500 kcal)</option>
                    <option value="250">Ganho Gradual (+250 kcal)</option>
                    <option value="0" selected>Manter Peso</option>
                    <option value="-250">Perda Gradual (-250 kcal)</option>
                    <option value="-500">Perda de Peso (-500 kcal)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nível de Atividade</label>
                <select id="idrActivity" class="form-control">
                    <option value="1.2">Sedentário</option>
                    <option value="1.375">Pouco Ativo</option>
                    <option value="1.55" selected>Ativo</option>
                    <option value="1.725">Muito Ativo</option>
                </select>
            </div>

            <div id="idrResult" class="idr-result" style="display:none"></div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeIdrModal()">Fechar</button>
                <button class="btn btn-primary" onclick="calcularIDR()">Calcular</button>
                <button class="btn btn-primary" id="idrApplyBtn" style="display:none" onclick="applyIDR()">Aplicar</button>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninju - Diário do Dia</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">NINJU</a>
        <ul class="navbar-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="daily-log.html" class="active">Diário</a></li>
            <li><a href="foods.html">Alimentos</a></li>
            <li><a href="workouts.html">Treinos</a></li>
            <li id="nav-users" style="display:none"><a href="users.html">Usuários</a></li>
        </ul>
        <div class="navbar-user">
            <button class="avatar-btn" id="avatarBtn" onclick="toggleDropdown()">
                <img id="navAvatar" src="../images/avatars/default.svg" alt="avatar">
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <img class="dropdown-avatar" id="dropdownAvatar" src="../images/avatars/default.svg" alt="avatar">
                    <div>
                        <div class="dropdown-username" id="dropdownName"></div>
                        <div class="dropdown-role" id="dropdownRole"></div>
                    </div>
                </div>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Meu Perfil
                    </a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item dropdown-item-danger" onclick="logout()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">📓 Diário do Dia</h1>

        <div id="alert" class="alert alert-error"></div>
        <div id="alert-success" class="alert alert-success"></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">

            <!-- Caso de uso 1: Registrar Refeição -->
            <div class="card">
                <div class="card-title">🥗 Registrar Refeição</div>
                <form id="form-refeicao">
                    <div class="form-group">
                        <label for="data-refeicao">Data</label>
                        <input type="date" id="data-refeicao" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="notas-refeicao">O que você comeu?</label>
                        <textarea id="notas-refeicao" class="form-control" placeholder="Ex: Café da manhã: aveia + banana. Almoço: arroz, feijão, frango..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar Refeição</button>
                </form>
            </div>

            <!-- Caso de uso 2: Registrar Treino -->
            <div class="card">
                <div class="card-title">🏋️ Registrar Treino</div>
                <form id="form-treino">
                    <div class="form-group">
                        <label for="data-treino">Data</label>
                        <input type="date" id="data-treino" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="notas-treino">O que você treinou?</label>
                        <textarea id="notas-treino" class="form-control" placeholder="Ex: Corrida 30 min + musculação peito e tríceps..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar Treino</button>
                </form>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card">
            <div class="card-title">📅 Histórico</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Refeições</th>
                            <th>Treino</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body">
                        <tr><td colspan="3" class="empty-state">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/daily-log.js"></script>
</body>
</html>

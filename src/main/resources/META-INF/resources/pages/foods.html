<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninju - Alimentos</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">NINJU</a>
        <ul class="navbar-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="daily-log.html">Diário</a></li>
            <li><a href="relatorios.html">Relatórios</a></li>
            <li id="nav-users" style="display:none"><a href="users.html">Usuários</a></li>
            <li id="nav-logs" style="display:none"><a href="logs.html">Logs</a></li>
        </ul>
        <div class="navbar-user">
            <button class="avatar-btn" id="avatarBtn" onclick="toggleDropdown()">
                <img id="navAvatar" src="../images/avatars/default.svg" alt="avatar">
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <img class="dropdown-avatar" id="dropdownAvatar" src="../images/avatars/default.svg" alt="avatar">
                    <div>
                        <div class="dropdown-username" id="dropdownName"></div>
                        <div class="dropdown-role" id="dropdownRole"></div>
                    </div>
                </div>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Meu Perfil
                    </a>
                    <a href="foods.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                        Alimentos
                    </a>
                    <a href="workouts.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M2 9h4M18 9h4M2 15h4M18 15h4"/></svg>
                        Treinos
                    </a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item dropdown-item-danger" onclick="logout()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">🥗 Alimentos</h1>
            <button class="btn btn-primary" onclick="openAddModal()">+ Adicionar</button>
        </div>

        <div id="alert" class="alert alert-error"></div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Alimento</th>
                            <th>Calorias (kcal)</th>
                            <th>Proteína (g)</th>
                            <th>Carboidratos (g)</th>
                            <th>Gordura (g)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="foods-body">
                        <tr><td colspan="6" class="empty-state">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal adicionar alimento -->
        <div class="modal-overlay" id="addFoodModal">
            <div class="modal">
                <div class="modal-header">
                    <span class="modal-title" id="addFoodTitle">Adicionar Alimento</span>
                    <button class="modal-close" onclick="closeAddModal()">&times;</button>
                </div>
                <div id="alert-modal" class="alert alert-error" style="margin-bottom:12px"></div>
                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" id="food-name" class="form-control" placeholder="Ex: Arroz branco cozido">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label>Calorias (kcal/100g) *</label>
                        <input type="number" id="food-calories" class="form-control" min="0">
                    </div>
                    <div class="form-group">
                        <label>Proteína (g/100g) *</label>
                        <input type="number" id="food-protein" class="form-control" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Carboidratos (g/100g) *</label>
                        <input type="number" id="food-carbs" class="form-control" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Gordura (g/100g) *</label>
                        <input type="number" id="food-fat" class="form-control" min="0" step="0.1">
                    </div>
                </div>
                <div id="admin-global-opt" style="display:none" class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500">
                        <input type="checkbox" id="food-global"> Adicionar para todos os usuários (global)
                    </label>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeAddModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="saveFood()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/foods.js"></script>
</body>
</html>

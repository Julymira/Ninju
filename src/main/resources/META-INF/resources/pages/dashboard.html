<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninju - Dashboard</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">NINJU</a>
        <ul class="navbar-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="daily-log.html">Diário</a></li>
            <li><a href="foods.html">Alimentos</a></li>
            <li><a href="workouts.html">Treinos</a></li>
            <li id="nav-users" style="display:none"><a href="users.html">Usuários</a></li>
        </ul>
        <div class="navbar-user">
            <button class="avatar-btn" id="avatarBtn" onclick="toggleDropdown()">
                <img id="navAvatar" src="../images/avatars/default.svg" alt="avatar">
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <img class="dropdown-avatar" id="dropdownAvatar" src="../images/avatars/default.svg" alt="avatar">
                    <div>
                        <div class="dropdown-username" id="dropdownName"></div>
                        <div class="dropdown-role" id="dropdownRole"></div>
                    </div>
                </div>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Meu Perfil
                    </a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item dropdown-item-danger" onclick="logout()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h2>Olá, <span id="welcome-name"></span>!</h2>
            <p>O que vamos fazer hoje?</p>
        </div>

        <div class="cards-grid" id="cards-grid">
            <a href="daily-log.html" class="nav-card">
                <div class="icon">📓</div>
                <h3>Diário do Dia</h3>
                <p>Registre suas refeições e treinos</p>
            </a>
            <a href="foods.html" class="nav-card">
                <div class="icon">🥗</div>
                <h3>Alimentos</h3>
                <p>Tabela nutricional de alimentos</p>
            </a>
            <a href="workouts.html" class="nav-card">
                <div class="icon">🏋️</div>
                <h3>Treinos</h3>
                <p>Catálogo de exercícios</p>
            </a>
            <a href="users.html" class="nav-card" id="card-users" style="display:none">
                <div class="icon">👥</div>
                <h3>Usuários</h3>
                <p>Gerenciar usuários do sistema</p>
            </a>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
